version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # TypeScript 7 (native compiler) is not yet accepted as a peer by
      # openapi-typescript or @astrojs/svelte. Revisit once they support it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # jsr:@soapbox/kysely-deno-sqlite (our SQLite dialect) still requires kysely ^0.27.
      # Revisit when it supports kysely 0.28+.
      - dependency-name: 'kysely'
        versions: ['>=0.28.0']

  - package-ecosystem: 'npm'
    directory: '/docs/site'
    schedule:
      interval: weekly
    groups:
      docs-npm-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # TypeScript 7 (native compiler) is not yet accepted as a peer by
      # openapi-typescript or @astrojs/svelte. Revisit once they support it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'gomod'
    directory: '/packages/praxrr-parser'
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - '*'
