name: Parser Container Smoke

on:
  workflow_call:

permissions:
  contents: read

env:
  DENO_VERSION: '2.5.6'
  IMAGE_BASE: ghcr.io/yandy-r
  PARSER_BEHAVIOR_VERSION: '2.0.0-go.1'

jobs:
  parser-image-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build native parser image for smoke
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.parser
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_BASE }}/praxrr-parser:smoke-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            PARSER_VERSION=${{ env.PARSER_BEHAVIOR_VERSION }}
          cache-from: type=gha,scope=parser-image-smoke
          cache-to: type=gha,scope=parser-image-smoke,mode=max

      - name: Install Trivy
        run: |
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.65.0
          trivy --version

      - name: Scan parser image with Trivy
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            "${IMAGE_BASE}/praxrr-parser:smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Smoke parser image
        run: |
          deno run -A scripts/smoke-parser-container.ts \
            --image "${IMAGE_BASE}/praxrr-parser:smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --expected-version "${PARSER_BEHAVIOR_VERSION}"
