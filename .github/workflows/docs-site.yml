name: Docs Site

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yml'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'deno.json'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-site.yml'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'deno.json'
  repository_dispatch:
    types:
      - praxrr-db-docs
      - praxrr-schema-docs
      - docs-rebuild
  workflow_dispatch:

concurrency:
  group: docs-site-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Praxrr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout schema docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yandy-r/praxrr-schema
          path: .external/praxrr-schema
          token: ${{ secrets.MIRROR_PAT || github.token }}
          sparse-checkout: |
            README.md
            docs
            pcd.json

      - name: Checkout database docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: yandy-r/praxrr-db
          path: .external/praxrr-db
          token: ${{ secrets.MIRROR_PAT || github.token }}
          sparse-checkout: |
            README.md
            docs
            pcd.json

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Import mirror docs
        working-directory: docs/site
        run: >
          npm run sync:external-docs --
          --schema-source=../../.external/praxrr-schema
          --db-source=../../.external/praxrr-db

      - name: Prepare monorepo TypeScript fallback
        run: |
          mkdir -p dist/.svelte-kit
          printf '{"compilerOptions":{}}\n' > dist/.svelte-kit/tsconfig.json

      - name: Build docs site
        working-directory: docs/site
        env:
          PRAXRR_SCHEMA_DOCS_SOURCE: ../../.external/praxrr-schema
          PRAXRR_DB_DOCS_SOURCE: ../../.external/praxrr-db
        run: npm run build

      - name: Verify version selector rendered
        working-directory: docs/site
        run: |
          set -euo pipefail
          # Structure, per-version HTML counts, symmetry, and per-version Pagefind indexes
          # are enforced by scripts/build-versions.mjs's guard during `npm run build` (the
          # single source of truth). This step adds the only check the build guard does not
          # perform: that each version renders the selector with its own option selected
          # (acceptance criterion #7).
          grep -q '<option value="/" selected' dist/getting-started/index.html
          grep -q '<option value="/next/" selected' dist/next/getting-started/index.html

      - name: Upload static site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: praxrr-docs-site
          path: docs/site/dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'repository_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout Praxrr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download static site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: praxrr-docs-site
          path: docs/site/dist

      - name: Deploy to Cloudflare Workers
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
