# TRaSH Guide manual-sync correlation schemas (issue #238).
# Kept in lockstep with the server types in
# packages/praxrr-app/src/lib/server/jobs/queueTypes.ts and the safe copy in
# packages/praxrr-app/src/lib/server/jobs/trashguide/syncFailure.ts.

TrashGuideSyncFailureCode:
  type: string
  description: 'Closed, safe vocabulary of TRaSH sync failure reasons. Assigned by outcome/error type only — never by message parsing — so no raw diagnostic can leak.'
  enum:
    - source_missing
    - source_disabled
    - network
    - parser_failed
    - sync_failed
    - internal

TrashGuideSyncFailureReason:
  type: object
  description: 'Typed, closed, SAFE failure evidence. message/recoveryAction are pre-authored copy that never embeds raw exception text, git/parser diagnostics, credentials, or hostnames.'
  required:
    - code
    - message
    - recoveryAction
  properties:
    code:
      $ref: '#/TrashGuideSyncFailureCode'
    message:
      type: string
    recoveryAction:
      type: string

TrashGuideSyncCounts:
  type: object
  description: 'Fetched/applied counts for a TRaSH sync run.'
  required:
    - commitsBehind
    - parsedFiles
    - failedFiles
    - activeOperations
    - removedEntities
    - renamedEntities
  properties:
    commitsBehind:
      type: integer
    parsedFiles:
      type: integer
    failedFiles:
      type: integer
    activeOperations:
      type: integer
    removedEntities:
      type: integer
    renamedEntities:
      type: integer

TrashGuideSyncRunEvidence:
  type: object
  description: 'Versioned, structured terminal evidence for one TRaSH sync run, serialized into job_run_history.output. Survives a source hard-delete via its embedded identity snapshot.'
  required:
    - schemaVersion
    - runToken
    - source
    - trigger
    - requestedAt
    - status
    - counts
    - failure
    - retry
  properties:
    schemaVersion:
      type: integer
      enum:
        - 1
    runToken:
      oneOf:
        - type: string
        - type: 'null'
    source:
      type: object
      required:
        - id
        - name
        - arrType
      properties:
        id:
          type: integer
        name:
          oneOf:
            - type: string
            - type: 'null'
        arrType:
          oneOf:
            - type: string
              enum:
                - radarr
                - sonarr
            - type: 'null'
    trigger:
      type: string
      enum:
        - manual
        - scheduled
    requestedAt:
      oneOf:
        - type: string
        - type: 'null'
    status:
      type: string
      enum:
        - success
        - failure
        - skipped
        - cancelled
    counts:
      oneOf:
        - $ref: '#/TrashGuideSyncCounts'
        - type: 'null'
    failure:
      oneOf:
        - $ref: '#/TrashGuideSyncFailureReason'
        - type: 'null'
    retry:
      type: object
      required:
        - rescheduleAt
        - retryable
      properties:
        rescheduleAt:
          oneOf:
            - type: string
            - type: 'null'
        retryable:
          type: boolean

TrashGuideSyncStatusView:
  type: object
  description: "Single wire view of a source's current queue slot + latest terminal run, reused by the POST response and the GET status resolver."
  required:
    - sourceId
    - sourceName
    - arrType
    - queueId
    - current
    - latestRun
  properties:
    sourceId:
      type: integer
    sourceName:
      oneOf:
        - type: string
        - type: 'null'
    arrType:
      oneOf:
        - type: string
          enum:
            - radarr
            - sonarr
        - type: 'null'
    queueId:
      oneOf:
        - type: integer
        - type: 'null'
    current:
      oneOf:
        - type: object
          required:
            - status
            - runAt
            - startedAt
            - attempts
            - runToken
          properties:
            status:
              type: string
            runAt:
              type: string
            startedAt:
              oneOf:
                - type: string
                - type: 'null'
            attempts:
              type: integer
            runToken:
              oneOf:
                - type: string
                - type: 'null'
        - type: 'null'
    latestRun:
      oneOf:
        - type: object
          required:
            - id
            - status
            - startedAt
            - finishedAt
            - durationMs
            - evidence
          properties:
            id:
              type: integer
            status:
              type: string
              enum:
                - success
                - failure
                - skipped
                - cancelled
            startedAt:
              type: string
            finishedAt:
              type: string
            durationMs:
              type: integer
            evidence:
              oneOf:
                - $ref: '#/TrashGuideSyncRunEvidence'
                - type: 'null'
        - type: 'null'

TrashGuideSyncQueuedResponse:
  type: object
  description: 'Manual-sync enqueue acknowledgement, linking to exactly one current-or-terminal run.'
  required:
    - success
    - queued
    - runToken
    - statusUrl
    - view
  properties:
    success:
      type: boolean
      enum:
        - true
    queued:
      type: boolean
      enum:
        - true
    runToken:
      type: string
    statusUrl:
      type: string
    view:
      $ref: '#/TrashGuideSyncStatusView'

TrashGuideSyncDedupeResponse:
  type: object
  description: 'Already-running dedupe response — links to the existing in-flight run rather than acking a new one.'
  required:
    - error
    - deduped
    - runToken
    - statusUrl
    - view
  properties:
    error:
      type: string
    deduped:
      type: boolean
      enum:
        - true
    runToken:
      type: string
    statusUrl:
      type: string
    view:
      $ref: '#/TrashGuideSyncStatusView'

TrashGuideEntityType:
  type: string
  enum:
    - custom_format
    - custom_format_group
    - quality_profile
    - quality_size
    - naming

TrashGuideEntityDetailResponse:
  type: object
  required:
    - source
    - trashId
    - type
    - name
    - filePath
    - fetchedAt
    - entity
  properties:
    source:
      type: object
      required:
        - type
        - id
        - name
        - arrType
      properties:
        type:
          type: string
          enum:
            - trash
        id:
          type: integer
        name:
          type: string
        arrType:
          type: string
          enum:
            - radarr
            - sonarr
    trashId:
      type: string
    type:
      $ref: '#/TrashGuideEntityType'
    name:
      type: string
    filePath:
      type: string
    fetchedAt:
      type: string
      format: date-time
    entity:
      type: object
      additionalProperties: true
    scores:
      type: object
      additionalProperties:
        type: number
    group:
      type: integer
      nullable: true

TrashGuideSourceArrType:
  type: string
  description: 'Arr app a TRaSH source targets. Only radarr and sonarr are supported (lidarr is rejected). Immutable after creation.'
  enum:
    - radarr
    - sonarr

TrashGuideSourceEntityCounts:
  type: object
  required:
    - customFormats
    - customFormatGroups
    - qualityProfiles
    - qualitySizes
    - naming
  properties:
    customFormats:
      type: integer
    customFormatGroups:
      type: integer
    qualityProfiles:
      type: integer
    qualitySizes:
      type: integer
    naming:
      type: integer

TrashGuideSource:
  type: object
  required:
    - id
    - name
    - repositoryUrl
    - branch
    - arrType
    - scoreProfile
    - autoPull
    - enabled
    - syncStrategy
    - lastSyncedAt
    - lastCommitHash
    - entityCounts
  properties:
    id:
      type: integer
    name:
      type: string
    repositoryUrl:
      type: string
    branch:
      type: string
    arrType:
      $ref: '#/TrashGuideSourceArrType'
    scoreProfile:
      type: string
    autoPull:
      type: boolean
    enabled:
      type: boolean
    syncStrategy:
      type: integer
      description: Sync interval in minutes (0 disables scheduled sync)
    lastSyncedAt:
      type: string
      format: date-time
      nullable: true
    lastCommitHash:
      type: string
      nullable: true
    entityCounts:
      $ref: '#/TrashGuideSourceEntityCounts'

TrashGuideSourceListResponse:
  type: object
  required:
    - sources
  properties:
    sources:
      type: array
      items:
        $ref: '#/TrashGuideSource'

TrashGuideSourceResponse:
  type: object
  required:
    - source
  properties:
    source:
      $ref: '#/TrashGuideSource'

TrashGuideSourceCreateRequest:
  type: object
  description: 'Unknown fields are rejected with 400. name, repositoryUrl and arrType are required.'
  additionalProperties: false
  required:
    - name
    - repositoryUrl
    - arrType
  properties:
    name:
      type: string
      minLength: 1
      description: Source name (trimmed; case-insensitively unique)
    repositoryUrl:
      type: string
      format: uri
      description: Git repository URL; must use http or https
    branch:
      type: string
      minLength: 1
      description: Branch to track (default `master`)
    arrType:
      $ref: '#/TrashGuideSourceArrType'
    scoreProfile:
      type: string
      minLength: 1
      description: TRaSH score profile key (default `default`)
    autoPull:
      type: boolean
      description: Default false
    enabled:
      type: boolean
      description: Default true
    syncStrategy:
      type: integer
      minimum: 0
      maximum: 525600
      description: Sync interval in minutes (default 0)

TrashGuideSourceUpdateRequest:
  type: object
  description: 'Partial update; at least one field is required and unknown fields are rejected with 400. arrType may only be supplied with its current value (changing it yields 422).'
  additionalProperties: false
  minProperties: 1
  properties:
    name:
      type: string
      minLength: 1
    repositoryUrl:
      type: string
      format: uri
      description: Must use http or https. Changing it re-clones the repository.
    branch:
      type: string
      minLength: 1
    arrType:
      $ref: '#/TrashGuideSourceArrType'
    scoreProfile:
      type: string
      minLength: 1
    autoPull:
      type: boolean
    enabled:
      type: boolean
    syncStrategy:
      type: integer
      minimum: 0
      maximum: 525600

TrashGuideEntityListItem:
  type: object
  required:
    - source
    - trashId
    - type
    - name
    - filePath
    - fetchedAt
    - entity
  properties:
    source:
      type: object
      required:
        - type
        - id
        - name
        - arrType
      properties:
        type:
          type: string
          enum:
            - trash
        id:
          type: integer
        name:
          type: string
        arrType:
          $ref: '#/TrashGuideSourceArrType'
    trashId:
      type: string
    type:
      $ref: '#/TrashGuideEntityType'
    name:
      type: string
    filePath:
      type: string
    fetchedAt:
      type: string
      format: date-time
    entity:
      type: object
      additionalProperties: true
    scores:
      type: object
      description: Present only for custom_format entities whose cached scores are all numeric
      additionalProperties:
        type: number
    group:
      type: integer
      nullable: true
      description: Present only for quality_profile entities

TrashGuideEntityListResponse:
  type: object
  required:
    - entities
    - pagination
  properties:
    entities:
      type: array
      items:
        $ref: '#/TrashGuideEntityListItem'
    pagination:
      type: object
      required:
        - limit
        - offset
        - nextCursor
        - total
        - hasMore
      properties:
        limit:
          type: integer
        offset:
          type: integer
        nextCursor:
          type: string
          nullable: true
          description: Offset of the next page as a string, or null when there are no more results
        total:
          type: integer
        hasMore:
          type: boolean
