health:
  get:
    operationId: getHealth
    summary: Health check
    description: |
      Returns the health status of the application and its components.

      Status values:
      - `healthy`: All components functioning normally
      - `degraded`: Core functionality works but some components have issues
      - `unhealthy`: Core functionality is broken

      Use `?verbose=true` for detailed component information.
    tags:
      - System
    parameters:
      - name: verbose
        in: query
        description: Include detailed component information
        schema:
          type: boolean
          default: false
    responses:
      '200':
        description: Health check response
        content:
          application/json:
            schema:
              $ref: '../schemas/health.yaml#/HealthResponse'

openapi:
  get:
    operationId: getOpenApiSpec
    summary: OpenAPI specification
    description: Returns the OpenAPI specification for this API
    tags:
      - System
    responses:
      '200':
        description: OpenAPI specification
        content:
          application/json:
            schema:
              type: object

parser-health:
  get:
    operationId: getParserHealth
    summary: Parser health check
    description: Returns the availability status of the release title parser service.
    tags:
      - System
    responses:
      '200':
        description: Parser health status
        content:
          application/json:
            schema:
              type: object
              required:
                - parserAvailable
              properties:
                parserAvailable:
                  type: boolean
                  description: Whether the parser service is reachable and healthy

metrics:
  get:
    operationId: getMetrics
    summary: Prometheus metrics
    description: |
      Prometheus text exposition (format 0.0.4) covering job runs, sync outcomes, drift, config
      health, security posture, parser availability, notification delivery, PCD cache state and
      build info. Labels never include Arr URLs or API keys. Authenticate with an API token
      (`prx_…`) carrying the `read` scope in the `X-Api-Key` header; tokens work under AUTH=on,
      AUTH=oidc, and for remote clients under AUTH=local. A token without the `read` scope gets 403
      `{ "error": "Forbidden", "requiredScope": "read" }`. Disabled (404) unless `METRICS_ENABLED`
      is on.
    tags:
      - System
    parameters:
      - name: X-Api-Key
        in: header
        required: false
        description: |
          Praxrr API token (`prx_…`) with the `read` scope. Required for non-browser clients under
          AUTH=on and AUTH=oidc, and for remote clients under AUTH=local.
        schema:
          type: string
    responses:
      '200':
        description: Metrics in Prometheus text exposition format.
        content:
          text/plain:
            schema:
              type: string
      '401':
        description: Unauthenticated (missing, invalid, revoked, or expired API token).
        content:
          application/json:
            schema:
              $ref: '../schemas/arr.yaml#/ErrorResponse'
      '403':
        description: The API token lacks the `read` scope.
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ScopeForbiddenResponse'
      '404':
        description: The metrics endpoint is disabled (METRICS_ENABLED is off).

startup-pull-latest:
  get:
    operationId: getLatestStartupPull
    summary: Latest startup pull run
    description: |
      Returns the latest startup pull run with per-instance outcomes.

      The startup pull feature reconstructs Arr sync selections from live Arr
      state on application startup when `PULL_ON_START=true`. This endpoint
      provides visibility into the most recent run for support and diagnostics.

      Run-level status values:
      - `success`: All instances completed without failures
      - `partial`: Some instances succeeded and some failed
      - `failed`: All instances failed
      - `skipped`: No instances were processed
      - `disabled`: Feature was disabled at run time

      Per-instance status values follow `JobRunStatus`:
      - `success`: Instance pull completed
      - `failure`: Instance pull failed
      - `skipped`: Instance was skipped
      - `cancelled`: Instance pull was cancelled
    tags:
      - System
    responses:
      '200':
        description: Latest startup pull run with per-instance outcomes
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/StartupPullRunResponse'
      '404':
        description: No startup pull runs exist
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
      '500':
        description: Failed to fetch latest startup pull run
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/ErrorResponse'
